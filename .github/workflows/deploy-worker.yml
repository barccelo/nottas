name: Deploy Nottas Assistant Worker

# Auto-publish Worker updates from main after deployment secrets are configured.
# No OAuth secrets are copied to GitHub: they remain in Cloudflare Worker Secrets.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'cloudflare/assistant/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: nottas-assistant-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved code
        uses: actions/checkout@v4

      - name: Check deployment credentials
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$DEPLOY_TOKEN" || -z "$DEPLOY_ACCOUNT" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub repository Actions secrets before deployment."
            exit 1
          fi

      - name: Validate Worker and assistant call delivery
        shell: bash
        run: |
          node --version
          node --check cloudflare/assistant/src/index.js
          node --check cloudflare/assistant/src/google-calendar.js
          node --check cloudflare/assistant/src/google-events.js
          node --test cloudflare/assistant/src/*.test.mjs

      - name: Deploy exact repository Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/assistant
          command: deploy
          wranglerVersion: "4"

      - name: Verify deployed Google OAuth callback and health
        shell: bash
        run: |
          set -euo pipefail
          base="https://nottas-assistant-api.losrobles.workers.dev"
          for try in 1 2 3 4 5; do
            health="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$base/health")"
            callback="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$base/v1/google/oauth/callback")"
            if [[ "$health" == "200" && "$callback" == "400" ]]; then
              echo "Worker deployed and Google Calendar OAuth route available."
              exit 0
            fi
            echo "Waiting for deployment: health=$health callback=$callback"
            sleep 3
          done
          echo "::error::Deployment validation failed: expected health 200 and OAuth callback 400 for missing parameters."
          exit 1

      - name: Verify Android Firebase public auto-configuration
        shell: bash
        run: |
          set -euo pipefail
          config_url="https://nottas-assistant-api.losrobles.workers.dev/v1/client-config"
          # Do not expose identifiers or keys in the build log.
          if curl --fail --silent --show-error --max-time 20 "$config_url" | jq -e             '.firebase | (.projectId | type == "string" and length > 0) and (.senderId | type == "string" and length > 0) and (.appId | type == "string" and length > 0) and (.apiKey | type == "string" and length > 0)' >/dev/null; then
            echo "Android Firebase public configuration is available for automatic setup."
          else
            echo "::warning::Android Firebase public configuration is incomplete in the Worker. Phones without previous Firebase setup cannot receive push. Set FIREBASE_PROJECT_ID, FIREBASE_SENDER_ID, FIREBASE_APP_ID and FIREBASE_API_KEY as Worker variables."
          fi
