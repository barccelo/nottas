name: Verify Nottas Sync Changes

on:
  pull_request:
    paths:
      - 'cloudflare/assistant/**'
      - '.github/workflows/test-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare Worker JavaScript
        run: |
          node --check cloudflare/assistant/src/index.js
          node --check cloudflare/assistant/src/google-calendar.js
          node --check cloudflare/assistant/src/google-events.js
      - name: Run complete sync and push regression tests
        run: node --test cloudflare/assistant/src/*.test.mjs
