name: Build Nottas Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: nottas-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Require private signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NOTTAS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NOTTAS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOTTAS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOTTAS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing Nottas signing secrets. See SIGNING.md; no APK will be published."
            exit 1
          fi

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign APK with private key and verify certificate
        shell: bash
        env:
          NOTTAS_KEYSTORE_BASE64: ${{ secrets.NOTTAS_KEYSTORE_BASE64 }}
          NOTTAS_KEYSTORE_PASSWORD: ${{ secrets.NOTTAS_KEYSTORE_PASSWORD }}
          NOTTAS_KEY_ALIAS: ${{ secrets.NOTTAS_KEY_ALIAS }}
          NOTTAS_KEY_PASSWORD: ${{ secrets.NOTTAS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/nottas-signing"
          KEYSTORE="$RUNNER_TEMP/nottas-signing/nottas-release.jks"
          ALIGNED="$RUNNER_TEMP/nottas-aligned.apk"
          SIGNED="app/build/outputs/apk/release/Nottas-release-signed.apk"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          trap 'rm -f "$KEYSTORE" "$ALIGNED"' EXIT

          test -f "$UNSIGNED"
          printf '%s' "$NOTTAS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$NOTTAS_KEY_ALIAS" \
            --ks-pass env:NOTTAS_KEYSTORE_PASSWORD \
            --key-pass env:NOTTAS_KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SIGNED"

      - name: Upload signed APK to Actions
        uses: actions/upload-artifact@v4
        with:
          name: Nottas-release-signed-apk
          path: app/build/outputs/apk/release/Nottas-release-signed.apk
          if-no-files-found: error

      - name: Read Android app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Publish private-signed APK for Obtainium
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Increase versionName and versionCode for the next update."
            exit 0
          fi
          apk="$RUNNER_TEMP/Nottas-$RELEASE_TAG.apk"
          cp app/build/outputs/apk/release/Nottas-release-signed.apk "$apk"
          gh release create "$RELEASE_TAG" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nottas $VERSION_NAME" \
            --latest \
            --notes "Nottas $VERSION_NAME (versionCode $VERSION_CODE). APK con firma privada permanente. Para instalaciones anteriores a v0.27.3, exporta los datos, reinstala e importa el respaldo."
